<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Book Store</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background-image: url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f");
  background-size: cover;
  background-position: center;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.overlay {
  background-color: rgba(0,0,0,0.6);
  flex: 1;
  color: white;
  display: flex;
  flex-direction: column;
}

.navbar {
  background-color: darkblue;
  text-align: center;
  padding: 15px;
}

.navbar a {
  color: white;
  text-decoration: none;
  margin: 10px;
  padding: 10px 15px;
  display: inline-block;
  border-radius: 5px;
  transition: 0.3s;
}

.navbar a:hover {
  background-color: navy;
  transform: scale(1.1);
}

.hero {
  text-align: center;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.hero h1 {
  font-size: 50px;
  margin-bottom: 15px;
}

.btn {
  background-color: orange;
  padding: 12px 25px;
  text-decoration: none;
  color: black;
  border-radius: 5px;
  transition: 0.3s;
  display: inline-block; 
  width: auto; 
  margin: 20px auto; 
}

.btn:hover {
  transform: scale(1.1);
}

footer {
  background-color: black;
  text-align: center;
  padding: 15px;
  font-size: 14px;
  color: white;
}
</style>
</head>

<body>
<div class="overlay">

  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
    <a href="registration.html">Register</a>
  </div>

  <div class="hero">
    <h1>📚 Online Book Store</h1>
    <p>Find your favorite books anytime</p>
    <a class="btn" href="catalogue.html">Start Exploring</a>
  </div>

  <!-- Footer -->
  <footer>
    <p>Copyright © W3Schools.com</p>
  </footer>

</div>
</body>
</html>
