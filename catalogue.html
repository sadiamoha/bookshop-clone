<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Catalogue</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background-color: #f4f4f4;
}

.navbar {
  text-align: center;
  background-color: darkblue;
  padding: 15px;
}

.navbar a {
  color: white;
  text-decoration: none;
  margin: 10px;
  padding: 10px 15px;
  display: inline-block;
  border-radius: 5px;
  transition: all 0.3s ease;
}

.navbar a:hover {
  background-color: navy;
  transform: scale(1.1);
  box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
}

.navbar a:active {
  transform: scale(0.95);
}

h2 {
  text-align: center;
  margin-top: 20px;
}

table {
  margin: auto;
  width: 85%;
  border-collapse: collapse;
  background-color: white;
  box-shadow: 0px 0px 10px gray;
  margin-top: 20px;
}

th {
  background-color: darkblue;
  color: white;
  padding: 12px;
}

td {
  padding: 12px;
  text-align: center;
}

tr:nth-child(even) {
  background-color: #f2f2f2;
}

tr:hover {
  background-color: #7f6d6d;
  transition: 0.3s;
}

img {
  width: 100px;
  height: 110px;
  border-radius: 5px;
}
</style>

</head>
